name: Zampto 自动续期

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 (北京时间 08:00)
  workflow_dispatch:
    inputs:
      force_renew:
        description: 'Force renewal regardless of expiry'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      enable_recording:
        description: 'Enable screen recording'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  zampto-auto:
    name: 检查并自动续期
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb ffmpeg curl unzip \
            fonts-noto-cjk \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: 📦 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          python -c "from cloakbrowser import ensure_binary; ensure_binary()"

      - name: 🌐 启动 TUIC 代理
        env:
          TUIC_URI: ${{ secrets.TUIC_URI }}
        run: |
          set -e
          if [ -z "$TUIC_URI" ]; then
            echo "[ERROR] TUIC_URI 未配置! GitHub 裸 IP 会被 Cloudflare 风控(403), 续期必失败"
            echo "请到 Settings -> Secrets 添加 TUIC_URI (tuic:// 节点链接)"
            exit 1
          fi

          echo "[1/4] Parsing TUIC URI ..."
          # Save URI to file to avoid env quoting issues
          printf '%s' "$TUIC_URI" > /tmp/tuic_uri.txt
          # Strip prefix (v2rayntuic:// or tuic://)
          URI_BODY=$(sed -E 's|^[a-z]+://||' /tmp/tuic_uri.txt)
          # Split userinfo@host?query
          USERINFO_HOST=$(echo "$URI_BODY" | cut -d'?' -f1)
          QUERY=$(echo "$URI_BODY" | cut -d'?' -f2-)
          USERINFO=$(echo "$USERINFO_HOST" | cut -d'@' -f1)
          HOSTPORT=$(echo "$USERINFO_HOST" | cut -d'@' -f2-)
          # URL-decode userinfo (UUID:password might be %-encoded)
          USERINFO_DECODED=$(printf '%b' "$(echo "$USERINFO" | sed 's/%/\\x/g')")
          UUID=$(echo "$USERINFO_DECODED" | cut -d':' -f1)
          PASSWORD=$(echo "$USERINFO_DECODED" | cut -d':' -f2-)
          SERVER=$(echo "$HOSTPORT" | cut -d':' -f1)
          PORT=$(echo "$HOSTPORT" | cut -d':' -f2-)
          # Parse query params
          SNI=$(echo "$QUERY" | tr '&' '\n' | grep -E '^sni=' | cut -d'=' -f2- | head -1)
          INSECURE=$(echo "$QUERY" | tr '&' '\n' | grep -E '^insecure=' | cut -d'=' -f2- | head -1)
          ALPN=$(echo "$QUERY" | tr '&' '\n' | grep -E '^alpn=' | cut -d'=' -f2- | head -1)
          [ -z "$SNI" ] && SNI="$SERVER"
          [ -z "$INSECURE" ] && INSECURE=0
          [ -z "$ALPN" ] && ALPN="h3"

          echo "  Server: $SERVER:$PORT"
          echo "  UUID:   $UUID"
          echo "  SNI:    $SNI"
          echo "  Insecure: $INSECURE"
          echo "  ALPN:   $ALPN"

          echo "[2/4] Downloading sing-box (supports TUIC v5 client) ..."
          # Use sing-box - widely used, stable, supports TUIC v5 inbound+outbound
          SB_VERSION="1.10.7"
          SB_URL="https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          echo "  URL: $SB_URL"
          curl -fSL "$SB_URL" -o /tmp/sb.tar.gz
          tar -xzf /tmp/sb.tar.gz -C /tmp/
          mv /tmp/sing-box-${SB_VERSION}-linux-amd64/sing-box /tmp/sing-box
          chmod +x /tmp/sing-box

          # Verify it's actually an ELF binary
          FILE_TYPE=$(file /tmp/sing-box 2>/dev/null || echo "unknown")
          echo "  File type: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -q "ELF"; then
            echo "[ERROR] sing-box binary is not valid ELF"
            exit 1
          fi
          /tmp/sing-box version

          echo "[3/4] Writing sing-box config ..."
          cat > /tmp/sb_config.json <<EOF
          {
            "log": { "level": "info", "timestamp": true },
            "inbounds": [
              {
                "type": "socks",
                "tag": "socks-in",
                "listen": "127.0.0.1",
                "listen_port": 1080
              }
            ],
            "outbounds": [
              {
                "type": "tuic",
                "tag": "tuic-out",
                "server": "$SERVER",
                "server_port": $PORT,
                "uuid": "$UUID",
                "password": "$PASSWORD",
                "tls": {
                  "enabled": true,
                  "server_name": "$SNI",
                  "alpn": ["$ALPN"],
                  "insecure": $([ "$INSECURE" = "1" ] && echo true || echo false)
                },
                "udp_relay_mode": "native",
                "congestion_control": "bbr"
              }
            ]
          }
          EOF
          cat /tmp/sb_config.json

          # Validate config before running
          echo "--- Validating config ---"
          /tmp/sing-box check -c /tmp/sb_config.json || { echo "[ERROR] sing-box config validation failed"; exit 1; }

          echo "[4/4] Starting sing-box ..."
          nohup /tmp/sing-box run -c /tmp/sb_config.json > /tmp/tuic.log 2>&1 &
          TUIC_PID=$!
          echo "TUIC_PID=$TUIC_PID"
          sleep 8

          echo "--- sing-box log ---"
          cat /tmp/tuic.log || true
          echo "--------------------"

          echo "Direct IP: $(curl -s --max-time 5 ifconfig.me || echo 'fail')"
          echo "Proxy IP:  $(curl -s --max-time 15 --socks5 127.0.0.1:1080 ifconfig.me || echo 'proxy fail')"

          # 代理必须可用: 没有代理 -> GitHub 裸 IP 会被 Cloudflare 风控(403), 续期必失败
          if curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://www.google.com -o /dev/null; then
            echo "PROXY_OK=1" >> $GITHUB_ENV
            echo "ALL_PROXY=socks5h://127.0.0.1:1080" >> $GITHUB_ENV
            echo "HTTP_PROXY=socks5h://127.0.0.1:1080" >> $GITHUB_ENV
            echo "HTTPS_PROXY=socks5h://127.0.0.1:1080" >> $GITHUB_ENV
            echo "[OK] TUIC proxy is ready"
          else
            echo "[ERROR] TUIC proxy is DOWN - cannot renew (GitHub IP blocked by Cloudflare)"
            echo "---- sing-box log ----"
            cat /tmp/tuic.log 2>/dev/null | tail -30 || echo "no log"
            echo "----------------------"
            exit 1
          fi

      - name: 🔄 运行续期脚本
        env:
          ZAMPTO_USERNAME: ${{ secrets.ZAMPTO_USERNAME }}
          ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
          ZAMPTO_SERVER_ID: ${{ secrets.ZAMPTO_SERVER_ID }}
          ZAMPTO_SESSION_SECRET: ${{ secrets.ZAMPTO_SESSION_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_RENEW: ${{ github.event.inputs.force_renew || 'false' }}
          ENABLE_RECORDING: ${{ github.event.inputs.enable_recording || 'false' }}
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension RANDR &
          XVFB_PID=$!
          sleep 2

          RECORD_PID=""
          if [ "$ENABLE_RECORDING" = "true" ]; then
            echo "Recording enabled"
            ffmpeg -f x11grab -video_size 1280x720 -framerate 10 -i :99 \
              -codec:v libx264 -preset ultrafast -crf 30 \
              -pix_fmt yuv420p -movflags +faststart /tmp/recording.mp4 \
              > /tmp/ffmpeg.log 2>&1 &
            RECORD_PID=$!
            sleep 2
          fi

          python zampto_auto.py
          PYTHON_EXIT=$?

          sleep 2
          [ -n "$RECORD_PID" ] && kill $RECORD_PID 2>/dev/null
          [ -n "$RECORD_PID" ] && wait $RECORD_PID 2>/dev/null
          kill $XVFB_PID 2>/dev/null

          # CRITICAL: Clear proxy env vars so subsequent Node.js steps (upload-artifact,
          # checkout cleanup) don't try to use SOCKS5 which they don't support
          echo "ALL_PROXY=" >> $GITHUB_ENV
          echo "HTTP_PROXY=" >> $GITHUB_ENV
          echo "HTTPS_PROXY=" >> $GITHUB_ENV

          exit $PYTHON_EXIT

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            ./screenshots/*.png
            ${{ github.event.inputs.enable_recording == 'true' && '/tmp/recording.mp4' || '' }}
          if-no-files-found: ignore
          retention-days: 3
